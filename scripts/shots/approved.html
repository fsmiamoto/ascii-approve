<!doctype html>
<!-- Mock of a PR timeline "approved these changes" review with an art in the
     comment body. Used only by scripts/shots/shoot.mjs for README screenshots. -->
<html lang="en" data-color-mode="light">
<head>
<meta charset="utf-8">
<style>
  :root {
    --canvas: #ffffff; --canvas-subtle: #f6f8fa; --fg: #1f2328; --muted: #656d76;
    --border: #d0d7de; --open: #1a7f37; --code-bg: #f6f8fa;
  }
  html[data-color-mode="dark"] {
    --canvas: #0d1117; --canvas-subtle: #161b22; --fg: #e6edf3; --muted: #8b949e;
    --border: #30363d; --open: #3fb950; --code-bg: #161b22;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--canvas); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
  }
  .timeline { width: 920px; margin: 0 auto; padding: 32px 24px; }
  .event { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--muted); }
  .check {
    width: 28px; height: 28px; border-radius: 50%; background: var(--open); color: #fff; flex: none;
    display: inline-flex; align-items: center; justify-content: center; font-size: 14px;
  }
  .event b { color: var(--fg); }
  .card { border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .card-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 16px;
    background: var(--canvas-subtle); border-bottom: 1px solid var(--border); font-size: 14px;
  }
  .avatar {
    width: 24px; height: 24px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #1f883d, #0969da);
    color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center;
  }
  .card-head .who b { font-weight: 600; }
  .card-head .who span { color: var(--muted); }
  .badge {
    margin-left: auto; font-size: 12px; color: var(--muted);
    border: 1px solid var(--border); border-radius: 999px; padding: 1px 8px;
  }
  .card-body { padding: 16px; }
  .card-body pre {
    margin: 0; padding: 16px; background: var(--code-bg); border-radius: 6px; overflow: auto;
    font: 11px/1.05 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; color: var(--fg);
    white-space: pre;
    /* Tight line-height so block-shading arts (░▒▓█) don't get horizontal seams. */
  }
  .reactions { display: flex; gap: 8px; margin-top: 12px; }
  .reaction {
    display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--muted);
  }
</style>
</head>
<body>
<div class="timeline">
  <div class="event"><span class="check">✔</span><span><b>fsmiamoto</b> approved these changes</span></div>
  <div class="card">
    <div class="card-head">
      <span class="avatar">fm</span>
      <span class="who"><b>fsmiamoto</b> <span>reviewed just now</span></span>
      <span class="badge">Approved</span>
    </div>
    <div class="card-body">
      <pre id="art"></pre>
      <div class="reactions">
        <span class="reaction">🚀 3</span><span class="reaction">😄 2</span><span class="reaction">👀 1</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
